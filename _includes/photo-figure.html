{% assign thumbnail = include.photo.thumbnails | first %}
<figure class="photo"{% if include.ratio %} style="--photo-ratio: {{ include.ratio }}"{% endif %}>
  <a class="photo-preview" href="{{ include.photo.image | relative_url }}" aria-label="Enlarge photo. {{ include.photo.alt | escape }}" data-photo-link>
    <img
      src="{{ thumbnail.path | relative_url }}"
      srcset="{% for source in include.photo.thumbnails %}{{ source.path | relative_url }} {{ source.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
      sizes="{{ include.sizes | escape }}"
      width="{{ include.photo.width }}"
      height="{{ include.photo.height }}"
      alt="{{ include.photo.alt | escape }}"
      {% if include.priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
      decoding="async">
  </a>
  {% if include.photo.caption or include.photo.location or include.photo.date %}
    <figcaption>
      {% if include.photo.caption %}<p>{{ include.photo.caption | escape }}</p>{% endif %}
      {% if include.photo.location or include.photo.date %}
        <p class="photo-meta">
          {% if include.photo.location %}{{ include.photo.location | escape }}{% endif %}
          {% if include.photo.location and include.photo.date %} · {% endif %}
          {% if include.photo.date %}<time datetime="{{ include.photo.date | escape }}">{{ include.photo.date | date: "%B %-d, %Y" }}</time>{% endif %}
        </p>
      {% endif %}
    </figcaption>
  {% endif %}
</figure>
