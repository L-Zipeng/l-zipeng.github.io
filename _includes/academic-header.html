<header class="site-header" data-site-header>
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.title | escape }}</a>
    <button class="menu-button" type="button" aria-controls="primary-navigation" aria-expanded="false" data-menu-button>
      Menu <span class="menu-mark" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="primary-navigation" aria-label="Main">
      <ul>
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title | escape }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
